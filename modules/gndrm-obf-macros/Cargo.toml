# gndrm-obf-macros — the `obf!`/`obfc!` proc macros backing `gndrm-obf`.
#
# `syn` parses the input literal and argument expressions (correct Rust string
# un-escaping and format placeholder handling — the crux of the transform);
# `quote` emits the decode-byte array and the `write!` call.

[package]
name = "gndrm-obf-macros"
description = "obf!/obfc! proc macros: XOR-encode literals, emit stack decode + format_args"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["parsing", "printing", "proc-macro", "full"] }
