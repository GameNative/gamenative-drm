[package]
name = "gndrm-lsfg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LSFG frame-generation support for gndrm: Lossless.dll reader, shader cache, C ABI"

# A library, not a cdylib: the six `lsfg_*` entry points `lsfg_dll.h` declares are
# consumed by the C++ engine linked into the ICD. They live in this crate rather
# than in `icd_shim` because a cdylib exports every `#[no_mangle]` symbol of its
# own crate, which would break the ICD's three-symbol dynamic table; symbols from
# a dependency archive are dropped by the linker's `--exclude-libs,ALL`.
[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
# The shim's log gate prefixes every diagnostic; literals stay obfuscated so a
# shipped binary's strings do not spell out the engine's internals.
gndrm-obf = { path = "../gndrm-obf" }
