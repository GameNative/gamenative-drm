[package]
name = "gndrm-android"
description = "In-app daemon: JNI entry points, SEQPACKET server, native SurfaceControl presenter (Android-only)"
version.workspace = true
edition.workspace = true
license.workspace = true

# System.loadLibrary("gamenative_drm") -> libgamenative_drm.so
[lib]
name = "gamenative_drm"
crate-type = ["cdylib"]

# `gndrm-obf` is target-independent (pure std) and used by the Android cdylib
# and by the host integration tests that include `src/*.rs` verbatim.
[dependencies]
gndrm-obf = { path = "../gndrm-obf" }

# Everything Android-specific is an android-only dependency: on the host the
# crate compiles to an empty stub so workspace-wide fmt/clippy/test stay green
# (real verification of this module is `tools/build-android.sh` + on-device).
[target.'cfg(target_os = "android")'.dependencies]
bitflags = "2"
gndrm-daemon = { path = "../gndrm-daemon" }
gndrm-uapi = { path = "../gndrm-uapi" }
jni = "0.21"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
