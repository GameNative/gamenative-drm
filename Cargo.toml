[workspace]
resolver = "2"
members = [
    "modules/gndrm-uapi",
    "modules/gndrm-daemon",
    "modules/gndrm-android",
    "icd_shim",
    "icd_shim/fixtures/mock-adrenotools",
    "icd_shim/fixtures/mock-freedreno",
    "icd_shim/fixtures/mock-vkdriver",
    "utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Perf-critical profile settings shared by the Android cdylib later.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
