[workspace]
resolver = "2"
members = [
    "modules/gndrm-lsfg",
    "modules/gndrm-obf",
    "modules/gndrm-obf-macros",
    "modules/gndrm-uapi",
    "modules/gndrm-daemon",
    "modules/gndrm-android",
    "icd_shim",
    "icd_shim/fixtures/mock-adrenotools",
    "icd_shim/fixtures/mock-freedreno",
    "icd_shim/fixtures/mock-vkdriver",
    "utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Joshua Tam", "GameNative Inc."]

# Perf-critical profile settings shared by the Android cdylib later.
#
# Panic strategy is `unwind`, NOT `abort`. The Android cdylib
# (modules/gndrm-android -> libgamenative_drm.so) hosts the gndrm daemon inside
# the GameNative app process, and containment depends on `std::panic::catch_unwind`
# at the JNI boundary and in the worker threads. Under `panic = "abort"` a panic
# terminates the process immediately and `catch_unwind` never runs, so a single
# runtime panic anywhere in the daemon would SIGABRT `app.gamenative` — exactly
# the tombstone this change removes. Unwinding is the price of that guarantee;
# the codegen/size cost is accepted for a display path that must never take the
# host app down.
[profile.release]
# `fat` LTO crosses crate boundaries so more of the daemon folds into one unit:
# cheaper for a reverse engineer to read a single link, at no runtime cost.
lto = "fat"
codegen-units = 1
panic = "unwind"
# Ship no static symbol table — `.symtab` names every internal function and
# crate; `.dynsym` is separately pinned to the export allowlist (the linker
# version scripts in tools/exports/). No debuginfo either.
strip = "symbols"
debug = false
